name: Build Noor Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          for z in *.zip; do
            unzip -o "$z"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: |
          cd NoorIslamicWallpaper
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Islamic-Live-Wallpaper-APK
          path: NoorIslamicWallpaper/app/build/outputs/apk/debug/app-debug.apk
          
